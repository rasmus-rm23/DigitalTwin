[project]
name = "digitaltwin-sidecar"
version = "0.1.0"
description = "Data and ML engine for DigitalTwin, driven by the Tauri app over JSON-RPC on stdio"
requires-python = ">=3.12"
dependencies = [
    # Added as features land: pandas, openpyxl, scikit-learn, torch, scipy
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digitaltwin_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
